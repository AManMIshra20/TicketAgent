# Render blueprint. Create the service from this repo and it deploys as-is.
#
# ANTHROPIC_API_KEY is deliberately optional. Without it the app runs in demo
# mode: real store, real retrieval, real gate, real queue, replayed reasoning.
# Set it in the Render dashboard to run the actual model -- never commit it.
services:
  - type: web
    name: meridian-review-console
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: AGENT_MODEL
        value: claude-sonnet-5
      - key: SEED
        value: "42"
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: meridian-data
      mountPath: /app/data
      sizeGB: 1
